<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldSimulator 地图查看器</title>
  <link rel="stylesheet" href="/viewer.css">
  <script src="/viewer.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <div class="brand-copy">
        <h1>WorldSimulator</h1>
        <p id="map-name">地图查看器</p>
      </div>
    </div>
    <div class="timeline">
      <label for="nodes">保存节点</label>
      <select id="nodes" disabled aria-label="保存节点">
        <option>正在读取</option>
      </select>
      <button id="reload" type="button">刷新</button>
      <button id="more-nodes" type="button" hidden>更多</button>
    </div>
  </header>

  <main class="workspace">
    <aside id="military-panel" class="military-panel" aria-labelledby="military-heading" hidden>
      <header class="military-bar">
        <h2 id="military-heading">军队</h2>
        <button id="close-military" type="button" class="quiet" aria-label="关闭军队面板" title="关闭军队面板">×</button>
      </header>
      <div id="military-content" class="military-content"></div>
    </aside>
    <section id="viewport" class="viewport" aria-label="世界地图">
      <canvas id="map" tabindex="0" aria-label="世界地图"
        aria-describedby="map-help">请使用支持 Canvas 的浏览器查看地图。</canvas>
      <p id="map-help" class="visually-hidden">拖动平移，滚轮缩放。点击省份或兵牌查看详情。放大可展开叠牌，缩小至最低倍率时隐藏兵牌。也可使用方向键、加减键和 Home 键。</p>
      <p id="map-status" class="map-status" role="status">正在加载地图…</p>
      <p id="map-counts" class="map-counts" hidden></p>
      <p id="unit-zoom-note" class="unit-zoom-note" role="status" hidden>放大地图可显示兵牌</p>
      <div class="zoom" role="group" aria-label="地图缩放">
        <button id="zoom-in" type="button" aria-label="放大" title="放大">+</button>
        <button id="zoom-out" type="button" aria-label="缩小" title="缩小">−</button>
        <button id="fit" type="button" title="显示全图">全图</button>
      </div>
    </section>

    <aside class="inspector" aria-label="地图图层与省份详情">
      <section class="pane" aria-labelledby="layer-heading">
        <h2 id="layer-heading">图层</h2>
        <fieldset class="layer-picker">
          <legend class="visually-hidden">底图着色</legend>
          <label><input type="radio" name="layer" value="terrain" checked><span>地形</span></label>
          <label><input type="radio" name="layer" value="state"><span>州</span></label>
          <label><input type="radio" name="layer" value="region"><span>战略区域</span></label>
          <label><input type="radio" name="layer" value="owner"><span>国家归属</span></label>
          <label><input type="radio" name="layer" value="controller"><span>实际控制</span></label>
          <label><input type="radio" name="layer" value="owner-gaps"><span>归属调试</span></label>
        </fieldset>
        <div class="overlay-picker">
          <label><input id="railways" type="checkbox"><span class="rail-key"></span>铁路示意</label>
          <label><input id="hubs" type="checkbox"><span class="hub-key"></span>补给中心</label>
          <label><input id="units" type="checkbox" checked><span class="unit-key"></span>兵牌</label>
          <label id="geo-border-option" hidden><input id="geo-borders" type="checkbox"><span class="geo-key"></span>史料边界</label>
        </div>
        <p id="geo-border-source" class="entity-source geo-border-source" hidden></p>
      </section>

      <section class="pane province-pane" aria-labelledby="province-heading">
        <h2 id="province-heading">查找</h2>
        <form id="search" role="search">
          <label class="visually-hidden" for="province-query">名称、实体地址或经纬度</label>
          <input id="province-query" maxlength="512" type="search" placeholder="名称、实体 ID 或节点地址"
            autocomplete="off" spellcheck="false" required>
          <button type="submit" class="primary">定位</button>
        </form>
        <p id="search-status" class="search-status" role="status" hidden></p>
        <ul id="search-results" class="entity-links" hidden></ul>
        <p id="empty-province" class="empty-province">点击地图查看省份。</p>
        <article id="province" hidden>
          <div class="province-toolbar">
            <span id="province-kind" class="province-kind"></span>
            <button id="clear-province" type="button" class="quiet">取消选中</button>
          </div>
          <h3 id="province-name"></h3>
          <dl class="province-facts">
            <div><dt>省 ID</dt><dd id="province-id"></dd></div>
            <div><dt>地形</dt><dd id="province-terrain"></dd></div>
            <div id="province-geography-row" hidden><dt>近似经纬度</dt><dd class="entity-source"><a
              id="province-geography" target="_blank" rel="noopener noreferrer" title="在 OpenStreetMap 核对位置"></a></dd></div>
            <div><dt>州</dt><dd id="province-state"></dd></div>
            <div><dt>战略区域</dt><dd id="province-region"></dd></div>
            <div id="province-owner-row" hidden><dt>归属</dt><dd id="province-owner"></dd></div>
            <div id="province-controller-row" hidden><dt>实际控制</dt><dd id="province-controller"></dd></div>
          </dl>
          <div id="province-unit-section" class="province-units" hidden>
            <h4>部署单位</h4>
            <ul id="province-units" class="entity-links"></ul>
          </div>
          <label for="province-address" class="address-label">节点地址</label>
          <div class="address-row">
            <input id="province-address" readonly spellcheck="false">
            <button id="copy" type="button" class="quiet">复制</button>
          </div>
          <div id="evidence" class="evidence" hidden>
            <h4>来源提示</h4>
            <ul id="evidence-list"></ul>
          </div>
        </article>
        <article id="entity-detail" hidden>
          <div class="province-toolbar">
            <span id="entity-kind" class="province-kind"></span>
            <button id="clear-entity" type="button" class="quiet">取消选中</button>
          </div>
          <h3 id="entity-name"></h3>
          <p id="entity-address" class="entity-address"></p>
          <div id="entity-content"></div>
        </article>
      </section>

      <section class="pane legend-pane" aria-labelledby="legend-heading">
        <h2 id="legend-heading">图例</h2>
        <ul id="legend"></ul>
        <div id="territory-gaps" hidden>
          <p id="territory-gap-status" class="search-status" role="status"></p>
          <ul id="territory-gap-list" class="entity-links"></ul>
          <button id="more-territory-gaps" type="button" class="quiet" hidden>更多待补省</button>
        </div>
      </section>
    </aside>
  </main>
  <dialog id="formation-dialog" class="formation-dialog" aria-labelledby="formation-title"></dialog>
</body>
</html>
